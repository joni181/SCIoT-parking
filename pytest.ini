[pytest]
# Put the repo root on sys.path so `import parking...` works without installing
# the package (replaces a root conftest.py).
pythonpath = .
testpaths = tests
markers =
    integration: needs a real MQTT broker + paho (amqtt). Slower; auto-skipped if deps absent.
filterwarnings =
    ignore:Loading plugins from EntryPoints is deprecated:DeprecationWarning
